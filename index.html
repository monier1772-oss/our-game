<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0914;
            color: #fff;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* جعل الواجهات تمتد على كامل الشاشة مثل الاسكرينات تماماً */
        .screen {
            width: 100vw;
            height: 100vh;
            background: #0b0914;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .hidden { display: none !important; }

        /* --- واجهة الاختيار مطابقة لـ image_e02ced.png --- */
        #welcome-screen {
            justify-content: center;
            align-items: center;
            background: #0b0914;
        }

        .login-card {
            background: #11101d;
            border: 1px solid #1a1829;
            border-radius: 24px;
            padding: 40px 30px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        .main-icon {
            font-size: 3.5rem;
            display: block;
            margin-bottom: 15px;
        }

        .login-card h1 {
            font-size: 1.8rem;
            color: #897cb5;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #514e6b;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .character-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        .char-btn {
            width: 100%;
            background: #161525;
            border: 1px solid #23213a;
            border-radius: 14px;
            padding: 16px;
            color: #bcbbcb;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease;
        }

        .char-btn:hover {
            border-color: #383459;
            background: #1b1a2e;
            color: #fff;
        }

        /* --- واجهة الشات مطابقة لـ image_e02c98.png --- */
        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 25px;
            background: #0b0914;
            border-bottom: 1px solid #151322;
        }

        .player-indicator-left {
            font-size: 0.85rem;
            color: #4b4865;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-title-info {
            text-align: right;
        }

        .chat-title-info h3 {
            font-size: 0.95rem;
            color: #fff;
            font-weight: 500;
        }

        .chat-title-info span {
            font-size: 0.75rem;
            color: #2ecc71;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
        }

        .header-avatar {
            width: 36px;
            height: 36px;
            background: #312e4f;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            border: 1px solid #443f6d;
        }

        .back-btn {
            background: none;
            border: none;
            color: #4b4865;
            font-size: 0.8rem;
            cursor: pointer;
            margin-right: 10px;
            text-decoration: underline;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #0b0914;
            position: relative;
        }

        /* --- أنيميشن الـ Loading لـ Start the conversation --- */
        .start-conversation-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            color: #4b4865;
            font-size: 0.9rem;
            pointer-events: none;
            user-select: none;
        }

        .loading-icon {
            font-size: 2rem;
            animation: pulse-glow 1.5s ease-in-out infinite;
        }

        .loading-text {
            animation: text-blink 1.5s linear infinite;
            letter-spacing: 0.5px;
        }

        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); opacity: 0.4; }
            50% { transform: scale(1.15); opacity: 1; color: #5d54a4; }
        }

        @keyframes text-blink {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* ستيلات الرسايل المحسنة */
        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 70%;
        }
        .message-wrapper.sent { align-self: flex-start; }
        .message-wrapper.received { align-self: flex-end; }

        .sender-name {
            font-size: 0.75rem;
            color: #3e3b54;
            margin-bottom: 4px;
            padding: 0 4px;
        }

        .message-box {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.4;
            cursor: pointer;
        }

        .sent .message-box { background: #19162a; color: #fff; border-bottom-left-radius: 4px; border: 1px solid #231f3a;}
        .received .message-box { background: #0c3e3f; color: #fff; border-bottom-right-radius: 4px; }

        .reply-context-box {
            background: rgba(0, 0, 0, 0.2);
            border-left: 2px solid #5d54a4;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            color: #7b74a8;
            margin-bottom: 6px;
        }

        .message-img { max-width: 100%; border-radius: 10px; margin-top: 4px; display: block; }

        /* الفويس بلاير */
        .audio-player { display: flex; align-items: center; gap: 10px; min-width: 160px; padding: 2px 0; }
        .play-play-btn {
            background: #5d54a4; border: none; width: 28px; height: 28px; border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 0.75rem;
        }
        .audio-wave-line { flex: 1; height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; position: relative; overflow: hidden; }
        .audio-progress { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; background: #5d54a4; }
        .audio-duration { font-size: 0.75rem; color: #4b4865; }

        .message-reactions {
            display: flex; gap: 2px; position: absolute; bottom: -10px; right: 8px;
            background: #0b0914; padding: 1px 5px; border-radius: 8px; border: 1px solid #1c192e; font-size: 0.7rem;
        }

        /* شريط الرد المقتبس */
        #reply-preview {
            display: flex; align-items: center; justify-content: space-between;
            background: #0b0914; padding: 8px 30px; border-top: 1px solid #151322; font-size: 0.85rem; color: #615c84;
        }

        /* --- شريط الإدخال الفخم مطابق لأسفل image_e02c98.png --- */
        .input-outer-container {
            padding: 0 20px 20px 20px;
            background: #0b0914;
        }

        .chat-input-area {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #11101d;
            border: 1px solid #1a182e;
            border-radius: 20px;
            padding: 10px 20px;
            width: 100%;
        }

        #msg-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            outline: none;
            font-size: 0.95rem;
            text-align: right;
        }
        #msg-input::placeholder { color: #3b3852; }

        .input-actions-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: #4f4b6e;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }
        .icon-btn:hover { color: #897cb5; }
        .send-main-btn { color: #5d54a4; }
        .send-main-btn:hover { color: #897cb5; }

        /* وضع التسجيل الصوتي داخل الشريط ممتد العرض */
        .recording-status {
            display: flex; align-items: center; gap: 10px; color: #ff7675; font-size: 0.9rem; flex: 1; justify-content: flex-end;
        }
        .wave-dot { width: 8px; height: 8px; background: #ff7675; border-radius: 50%; animation: pulse 0.8s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.4); opacity: 0.5; } }

        /* قفل الخيارات المنبثق عند الضغط المطول */
        .action-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(11, 9, 20, 0.85);
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 200;
            opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
        }
        .action-overlay.active { opacity: 1; pointer-events: auto; }
        .overlay-card { background: #11101d; border: 1px solid #1a182e; border-radius: 20px; padding: 20px; width: 260px; text-align: center; }
        .reaction-row { display: flex; justify-content: space-around; margin-bottom: 15px; }
        .reaction-row span { font-size: 1.6rem; cursor: pointer; transition: transform 0.1s; }
        .reaction-row span:hover { transform: scale(1.2); }
        .overlay-btn { width: 100%; background: #161525; border: 1px solid #23213a; color: #fff; padding: 10px; border-radius: 12px; cursor: pointer; font-size: 0.9rem; }
        .overlay-btn:hover { background: #5d54a4; }
    </style>
</head>
<body>

    <!-- Welcome Screen (image_e02ced.png Style) -->
    <div id="welcome-screen" class="screen">
        <div class="login-card">
            <span class="main-icon">🕹️</span>
            <h1>Our Game</h1>
            <p class="subtitle">Choose your character</p>
            
            <div class="character-container">
                <button class="char-btn" onclick="selectCharacter('Player 1', '🎮')">
                    <span>Player 1</span>
                    <span>🎮</span>
                </button>
                
                <button class="char-btn" onclick="selectCharacter('Player 2', '🕹️')">
                    <span>Player 2</span>
                    <span>🕹️</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Chat Screen (image_e02c98.png Style) -->
    <div id="chat-screen" class="screen hidden">
        <div class="chat-header">
            <div class="player-indicator-left" id="current-player-label">Player 1</div>
            
            <div class="header-right">
                <button onclick="goBack()" class="back-btn">Exit</button>
                <div class="chat-title-info">
                    <h3 id="target-player-title">Chat with Player 2</h3>
                    <span>Online <span class="dot"></span></span>
                </div>
                <div class="header-avatar" id="target-avatar-icon">🕹️</div>
            </div>
        </div>

        <div class="messages-container" id="messages-container">
            <!-- Loading / Start Conversation Element -->
            <div id="loading-conversation" class="start-conversation-loading">
                <span class="loading-icon">👾</span>
                <span class="loading-text">!Start the conversation</span>
            </div>
        </div>

        <!-- Pending Reply Context -->
        <div id="reply-preview" class="hidden">
            <span id="reply-preview-text">Replying...</span>
            <span style="cursor:pointer; color:#ff7675;" onclick="cancelReply()">✕</span>
        </div>

        <!-- Luxury Full Width Input Container -->
        <div class="input-outer-container">
            <!-- Normal Mode -->
            <div class="chat-input-area" id="input-bar-normal">
                <input type="text" id="msg-input" placeholder="...Type a message" dir="rtl" onkeypress="handleKeyPress(event)">
                
                <div class="input-actions-left">
                    <label for="image-input" class="icon-btn" title="Send Image">
                        🖼️
                        <input type="file" id="image-input" accept="image/*" style="display:none;" onchange="handleImageUpload(event)">
                    </label>
                    <button class="icon-btn" onclick="startVoiceRecord()" title="Record Voice">🎙️</button>
                    <button class="icon-btn send-main-btn" onclick="sendMessage()">🚀</button>
                </div>
            </div>

            <!-- Recording Mode Inside Same Frame -->
            <div class="chat-input-area hidden" id="input-bar-recording">
                <div class="recording-status">
                    <span class="wave-dot"></span>
                    <span>Recording: <span id="record-timer">00:00</span></span>
                </div>
                <button class="icon-btn" style="color: #ff7675; font-size: 0.85rem; margin-left: 15px;" onclick="cancelVoiceRecord()">Cancel</button>
                <button class="icon-btn" style="color: #2ecc71; font-size: 1.1rem;" onclick="stopAndSendVoice()">✓</button>
            </div>
        </div>
    </div>

    <!-- Long Press Action Pop-up Modal -->
    <div id="action-overlay" class="action-overlay" onclick="closeOverlay()">
        <div class="overlay-card" onclick="event.stopPropagation()">
            <div class="reaction-row">
                <span onclick="addReaction('👍')">👍</span>
                <span onclick="addReaction('😂')">😂</span>
                <span onclick="addReaction('❤️')">❤️</span>
                <span onclick="addReaction('😢')">😢</span>
            </div>
            <button class="overlay-btn" onclick="triggerReply()">Reply to Message</button>
        </div>
    </div>

    <script>
        // تحميل البيانات من الـ localStorage لتجنب المسح عند الريفرش
        let messages = JSON.parse(localStorage.getItem('og_game_chat_data')) || [];
        let currentUser = "Player 1";
        let activeTargetId = null;
        let activeReplyId = null;
        
        let recordInterval;
        let recordSeconds = 0;
        let pressTimer;

        window.onload = function() {
            renderMessages();
        };

        function selectCharacter(player, emoji) {
            currentUser = player;
            
            // تخصيص بيانات الهيدر بناءً على اختيارك لمطابقة الصورة تماماً
            document.getElementById('current-player-label').innerText = currentUser;
            const targetPlayer = (currentUser === "Player 1") ? "Player 2" : "Player 1";
            const targetEmoji = (currentUser === "Player 1") ? "🕹️" : "🎮";
            
            document.getElementById('target-player-title').innerText = `Chat with ${targetPlayer}`;
            document.getElementById('target-avatar-icon').innerText = targetEmoji;

            document.getElementById('welcome-screen').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');
            renderMessages();
        }

        function goBack() {
            document.getElementById('chat-screen').classList.add('hidden');
            document.getElementById('welcome-screen').classList.remove('hidden');
        }

        function renderMessages() {
            const container = document.getElementById('messages-container');
            
            // إخفاء أو إظهار الـ Loading Animation الخاص بجملة !Start the conversation
            const loadingEl = document.getElementById('loading-conversation');
            if (messages.length === 0) {
                if(!loadingEl) {
                    container.innerHTML = `
                        <div id="loading-conversation" class="start-conversation-loading">
                            <span class="loading-icon">👾</span>
                            <span class="loading-text">!Start the conversation</span>
                        </div>`;
                } else {
                    loadingEl.classList.remove('hidden');
                }
            } else {
                if(loadingEl) loadingEl.classList.add('hidden');
                // مسح الرسايل القديمة لإعادة بنائها
                const items = container.querySelectorAll('.message-wrapper');
                items.forEach(el => el.remove());
            }

            messages.forEach(msg => {
                const isMine = (msg.sender === currentUser);
                const wrapper = document.createElement('div');
                wrapper.className = `message-wrapper ${isMine ? 'sent' : 'received'}`;
                
                const name = document.createElement('div');
                name.className = 'sender-name';
                name.innerText = msg.sender;
                wrapper.appendChild(name);

                const box = document.createElement('div');
                box.className = 'message-box';

                // تمكين الـ Long Press
                box.addEventListener('mousedown', (e) => startHold(e, msg.id));
                box.addEventListener('touchstart', (e) => startHold(e, msg.id));
                box.addEventListener('mouseup', clearHold);
                box.addEventListener('mouseleave', clearHold);
                box.addEventListener('touchend', clearHold);

                if (msg.replyTo) {
                    const orig = messages.find(m => m.id === msg.replyTo);
                    const replyCtx = document.createElement('div');
                    replyCtx.className = 'reply-context-box';
                    replyCtx.innerText = orig ? `↩️ ${orig.sender}: ${orig.text || 'Media'}` : 'Deleted Message';
                    box.appendChild(replyCtx);
                }

                if (msg.type === "text") {
                    const t = document.createElement('span');
                    t.innerText = msg.text;
                    box.appendChild(t);
                } else if (msg.type === "image") {
                    const img = document.createElement('img');
                    img.src = msg.mediaUrl;
                    img.className = 'message-img';
                    box.appendChild(img);
                } else if (msg.type === "voice") {
                    const playerDiv = document.createElement('div');
                    playerDiv.className = 'audio-player';
                    playerDiv.innerHTML = `
                        <button class="play-play-btn" onclick="playAudioMock(this, ${msg.id})">▶</button>
                        <div class="audio-wave-line"><div class="audio-progress" id="progress-${msg.id}"></div></div>
                        <span class="audio-duration" id="duration-${msg.id}">${msg.duration || '0:04'}</span>
                    `;
                    box.appendChild(playerDiv);
                }

                if (msg.reactions && msg.reactions.length > 0) {
                    const rc = document.createElement('div');
                    rc.className = 'message-reactions';
                    rc.innerText = msg.reactions.join(' ');
                    box.appendChild(rc);
                }

                wrapper.appendChild(box);
                container.appendChild(wrapper);
            });
            container.scrollTop = container.scrollHeight;
        }

        function startHold(e, msgId) {
            activeTargetId = msgId;
            pressTimer = setTimeout(() => {
                document.getElementById('action-overlay').classList.add('active');
            }, 500); 
        }

        function clearHold() { clearTimeout(pressTimer); }
        function closeOverlay() { document.getElementById('action-overlay').classList.remove('active'); }

        function addReaction(emoji) {
            const msg = messages.find(m => m.id === activeTargetId);
            if (msg) {
                if (!msg.reactions.includes(emoji)) msg.reactions.push(emoji);
                else msg.reactions = msg.reactions.filter(e => e !== emoji);
                localStorage.setItem('og_game_chat_data', JSON.stringify(messages));
                renderMessages();
            }
            closeOverlay();
        }

        function triggerReply() {
            activeReplyId = activeTargetId;
            const msg = messages.find(m => m.id === activeReplyId);
            if(msg) {
                document.getElementById('reply-preview-text').innerText = `Replying to ${msg.sender}`;
                document.getElementById('reply-preview').classList.remove('hidden');
            }
            closeOverlay();
        }

        function cancelReply() {
            activeReplyId = null;
            document.getElementById('reply-preview').classList.add('hidden');
        }

        function sendMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text) return;

            messages.push({
                id: Date.now(),
                sender: currentUser,
                text: text,
                type: "text",
                replyTo: activeReplyId,
                reactions: []
            });
            input.value = "";
            cancelReply();
            localStorage.setItem('og_game_chat_data', JSON.stringify(messages));
            renderMessages();
        }

        function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                messages.push({
                    id: Date.now(),
                    sender: currentUser,
                    type: "image",
                    mediaUrl: evt.target.result,
                    replyTo: activeReplyId,
                    reactions: []
                });
                cancelReply();
                localStorage.setItem('og_game_chat_data', JSON.stringify(messages));
                renderMessages();
            };
            reader.readAsDataURL(file);
        }

        function startVoiceRecord() {
            document.getElementById('input-bar-normal').classList.add('hidden');
            document.getElementById('input-bar-recording').classList.remove('hidden');
            recordSeconds = 0;
            document.getElementById('record-timer').innerText = "00:00";
            recordInterval = setInterval(() => {
                recordSeconds++;
                let mins = String(Math.floor(recordSeconds / 60)).padStart(2, '0');
                let secs = String(recordSeconds % 60).padStart(2, '0');
                document.getElementById('record-timer').innerText = `${mins}:${secs}`;
            }, 1000);
        }

        function cancelVoiceRecord() {
            clearInterval(recordInterval);
            document.getElementById('input-bar-recording').classList.add('hidden');
            document.getElementById('input-bar-normal').classList.remove('hidden');
        }

        function stopAndSendVoice() {
            clearInterval(recordInterval);
            let finalDuration = document.getElementById('record-timer').innerText;
            if(finalDuration === "00:00") finalDuration = "00:02";

            messages.push({
                id: Date.now(),
                sender: currentUser,
                type: "voice",
                duration: finalDuration,
                replyTo: activeReplyId,
                reactions: []
            });

            cancelReply();
            localStorage.setItem('og_game_chat_data', JSON.stringify(messages));
            cancelVoiceRecord();
            renderMessages();
        }

        function playAudioMock(btn, msgId) {
            const progressBar = document.getElementById(`progress-${msgId}`);
            if (btn.innerText === "▶") {
                btn.innerText = "⏸";
                let pct = 0;
                progressBar.style.width = "0%";
                const interval = setInterval(() => {
                    if (btn.innerText === "▶") { clearInterval(interval); return; }
                    pct += 5;
                    progressBar.style.width = `${pct}%`;
                    if (pct >= 100) {
                        clearInterval(interval);
                        btn.innerText = "▶";
                        progressBar.style.width = "0%";
                    }
                }, 200);
            } else {
                btn.innerText = "▶";
                progressBar.style.width = "0%";
            }
        }
    </script>
</body>
</html>
