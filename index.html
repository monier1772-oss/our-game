<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Our Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0914;
            color: #fff;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .screen {
            width: 100vw;
            height: 100dvh;
            background: #0b0914;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .hidden { display: none !important; }

        /* Welcome Screen */
        #welcome-screen { justify-content: center; align-items: center; }
        .login-card { background: #11101d; border: 1px solid #1a1829; border-radius: 24px; padding: 40px 30px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.4); }
        .main-icon { font-size: 3.5rem; margin-bottom: 15px; }
        .login-card h1 { font-size: 1.8rem; color: #897cb5; font-weight: 600; margin-bottom: 8px; }
        .subtitle { color: #514e6b; font-size: 0.9rem; margin-bottom: 30px; }
        .character-container { display: flex; flex-direction: column; gap: 15px; }
        .char-btn { width: 100%; background: #161525; border: 1px solid #23213a; border-radius: 14px; padding: 16px; color: #bcbbcb; font-size: 1rem; font-weight: 500; cursor: pointer; display: flex; justify-content: center; gap: 10px; transition: all 0.2s; }
        .char-btn:hover { border-color: #383459; background: #1b1a2e; color: #fff; }

        /* Chat Screen */
        .chat-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 15px; background: #0b0914; border-bottom: 1px solid #151322; min-height: 60px; }
        .player-indicator-left { font-size: 0.8rem; color: #4b4865; }
        .header-right { display: flex; align-items: center; gap: 8px; }
        .chat-title-info { text-align: right; }
        .chat-title-info h3 { font-size: 0.85rem; color: #fff; font-weight: 500; }
        .status-text { font-size: 0.7rem; color: #7f8c8d; display: flex; align-items: center; justify-content: flex-end; gap: 4px; }
        .status-text.online-style { color: #2ecc71; }
        .dot { width: 7px; height: 7px; background: #7f8c8d; border-radius: 50%; }
        .dot.active-dot { background: #2ecc71; box-shadow: 0 0 8px #2ecc71; }
        .header-avatar { width: 32px; height: 32px; background: #312e4f; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.95rem; border: 1px solid #443f6d; }
        .back-btn { background: none; border: none; color: #897cb5; font-size: 0.8rem; cursor: pointer; text-decoration: underline; }

        .messages-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; background: #0b0914; }

        /* Messages */
        .message-wrapper { display: flex; flex-direction: column; max-width: 75%; margin-bottom: 5px; }
        .message-wrapper.sent { align-self: flex-start; }
        .message-wrapper.received { align-self: flex-end; }
        .sender-name { font-size: 0.75rem; color: #3e3b54; margin-bottom: 4px; }
        .message-box { padding: 10px 14px; border-radius: 16px; font-size: 0.9rem; line-height: 1.4; cursor: pointer; display: flex; flex-direction: column; }
        .sent .message-box { background: #19162a; color: #fff; border: 1px solid #231f3a; border-bottom-left-radius: 4px; }
        .received .message-box { background: #0c3e3f; color: #fff; border-bottom-right-radius: 4px; }
        .message-time { font-size: 0.65rem; color: #524e75; align-self: flex-end; margin-top: 4px; }
        .received .message-time { color: #518789; }

        .message-img, .message-video { max-width: 100%; border-radius: 10px; margin-top: 4px; display: block; cursor: pointer; }
        
        .audio-player { display: flex; align-items: center; gap: 8px; min-width: 150px; }
        .play-btn { background: #5d54a4; border: none; width: 26px; height: 26px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 0.7rem; }
        .audio-progress-bar { flex: 1; height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; position: relative; overflow: hidden; }
        .audio-progress { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; background: #5d54a4; }

        .video-wrapper { position: relative; cursor: pointer; margin-top: 4px; }
        .video-play-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.6rem; color: #fff; background: rgba(0,0,0,0.55); border-radius: 50%; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; }

        /* Lightbox */
        .lightbox-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.92); z-index: 500; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
        .lightbox-overlay.active { opacity: 1; pointer-events: auto; }
        .lightbox-content { max-width: 92vw; max-height: 88vh; border-radius: 8px; }
        .lightbox-close { position: absolute; top: 18px; right: 18px; font-size: 1.8rem; color: #fff; cursor: pointer; background: rgba(255,255,255,0.1); border: none; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; z-index: 501; }

        /* Input */
        .input-outer-container { padding: 0 12px 12px 12px; background: #0b0914; }
        .chat-input-area { display: flex; align-items: center; gap: 10px; background: #11101d; border: 1px solid #1a182e; border-radius: 18px; padding: 8px 14px; }
        #msg-input { flex: 1; background: transparent; border: none; color: #fff; outline: none; font-size: 0.9rem; text-align: right; }
        #msg-input::placeholder { color: #3b3852; }
        .icon-btn { background: none; border: none; font-size: 1.15rem; cursor: pointer; color: #4f4b6e; display: flex; align-items: center; justify-content: center; }
        .icon-btn:hover { color: #897cb5; }
        .send-btn { color: #5d54a4; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div id="welcome-screen" class="screen">
        <div class="login-card">
            <span class="main-icon">🕹️</span>
            <h1>Our Game</h1>
            <p class="subtitle">Choose your character</p>
            <div class="character-container">
                <button class="char-btn" onclick="selectCharacter('Player 1')">Player 1 🎮</button>
                <button class="char-btn" onclick="selectCharacter('Player 2')">Player 2 🕹️</button>
            </div>
        </div>
    </div>

    <div id="chat-screen" class="screen hidden">
        <div class="chat-header">
            <div class="player-indicator-left" id="current-player-label">Player 1</div>
            <div class="header-right">
                <button onclick="goBack()" class="back-btn">Exit</button>
                <div class="chat-title-info">
                    <h3 id="target-player-title">Chat with Player 2</h3>
                    <div class="status-text" id="header-status">Offline <span class="dot" id="status-dot"></span></div>
                </div>
                <div class="header-avatar" id="target-avatar">🕹️</div>
            </div>
        </div>

        <div class="messages-container" id="messages-container"></div>

        <div class="input-outer-container">
            <div class="chat-input-area">
                <input type="text" id="msg-input" placeholder="...Type a message" dir="rtl" onkeypress="handleKeyPress(event)">
                <div style="display: flex; gap: 10px; align-items: center;">
                    <label for="image-input" class="icon-btn" title="Image">🖼️
                        <input type="file" id="image-input" accept="image/*" style="display:none;" onchange="handleImageUpload(event)">
                    </label>
                    <label for="video-input" class="icon-btn" title="Video">🎬
                        <input type="file" id="video-input" accept="video/*" style="display:none;" onchange="handleVideoUpload(event)">
                    </label>
                    <button class="icon-btn" onclick="startVoiceRecord()" title="Voice">🎙️</button>
                    <button class="icon-btn send-btn" onclick="sendMessage()">🚀</button>
                </div>
            </div>
        </div>
    </div>

    <div id="lightbox-overlay" class="lightbox-overlay" onclick="closeLightbox()">
        <button class="lightbox-close" onclick="closeLightbox()">✕</button>
        <img id="lightbox-img" class="lightbox-content hidden" onclick="event.stopPropagation()">
        <video id="lightbox-video" class="lightbox-content hidden" controls playsinline onclick="event.stopPropagation()"></video>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://ourgamechat-msm-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const messagesRef = database.ref('global_game_messages');
        const typingRef = database.ref('typing_status');
        const presenceRef = database.ref('presence_status');
        const lastSeenRef = database.ref('last_seen_status');

        let messages = [];
        let currentUser = "Player 1";
        let typingTimeout, pressTimer;
        let mediaRecorder, audioChunks = [];

        // --- Cloudinary Upload ---
        const CLOUDINARY_CLOUD = "diwelcaar";
        const CLOUDINARY_PRESET = "pgkh9dp5";

        function uploadToCloudinary(file) {
            const url = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/auto/upload`;
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', CLOUDINARY_PRESET);
            formData.append('quality', 'auto:best');
            formData.append('fetch_format', 'auto');

            return fetch(url, { method: 'POST', body: formData })
                .then(r => r.json())
                .then(d => d.secure_url || Promise.reject(d.error));
        }

        function selectCharacter(player) {
            currentUser = player;
            document.getElementById('current-player-label').innerText = player;
            const target = (player === "Player 1") ? "Player 2" : "Player 1";
            const emoji = (player === "Player 1") ? "🕹️" : "🎮";
            document.getElementById('target-player-title').innerText = `Chat with ${target}`;
            document.getElementById('target-avatar').innerText = emoji;
            document.getElementById('welcome-screen').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');
            setupPresence();
            syncUserStatus();
            loadMessages();
        }

        function setupPresence() {
            database.ref('.info/connected').on('value', (snap) => {
                if (!snap.val()) return;
                presenceRef.child(currentUser).onDisconnect().set(false);
                lastSeenRef.child(currentUser).onDisconnect().set(firebase.database.ServerValue.TIMESTAMP);
                presenceRef.child(currentUser).set(true);
            });
        }

        function syncUserStatus() {
            const target = (currentUser === "Player 1") ? "Player 2" : "Player 1";
            database.ref().on('value', (snap) => {
                const data = snap.val() || {};
                const presence = data.presence_status || {};
                const lastSeen = data.last_seen_status || {};
                const ind = document.getElementById('header-status');
                
                if (presence[target]) {
                    ind.innerHTML = 'Online <span class="dot active-dot"></span>';
                    ind.className = "status-text online-style";
                } else {
                    const time = lastSeen[target];
                    ind.innerHTML = time ? `Last seen ${formatTime(time)} <span class="dot"></span>` : 'Offline <span class="dot"></span>';
                    ind.className = "status-text";
                }
            });
        }

        function formatTime(ts) {
            const d = new Date(ts);
            const h = String(d.getHours() % 12 || 12).padStart(2, '0');
            const m = String(d.getMinutes()).padStart(2, '0');
            const a = d.getHours() >= 12 ? 'PM' : 'AM';
            return `${h}:${m} ${a}`;
        }

        function loadMessages() {
            messagesRef.on('value', (snap) => {
                messages = [];
                const data = snap.val();
                if (data) Object.entries(data).forEach(([k, v]) => messages.push({id: k, ...v}));
                renderMessages();
            });
        }

        function renderMessages() {
            const container = document.getElementById('messages-container');
            container.innerHTML = '';
            messages.forEach(msg => {
                const isMine = msg.sender === currentUser;
                const wrapper = document.createElement('div');
                wrapper.className = `message-wrapper ${isMine ? 'sent' : 'received'}`;
                
                const name = document.createElement('div');
                name.className = 'sender-name';
                name.innerText = msg.sender;
                wrapper.appendChild(name);

                const box = document.createElement('div');
                box.className = 'message-box';

                if (msg.type === "text") {
                    box.innerText = msg.text;
                } else if (msg.type === "image") {
                    const img = document.createElement('img');
                    img.src = msg.mediaUrl;
                    img.className = 'message-img';
                    img.loading = 'lazy';
                    img.onclick = () => openLightbox(msg.mediaUrl, 'image');
                    box.appendChild(img);
                } else if (msg.type === "video") {
                    const vwrap = document.createElement('div');
                    vwrap.className = 'video-wrapper';
                    vwrap.onclick = () => openLightbox(msg.mediaUrl, 'video');
                    const vid = document.createElement('video');
                    vid.src = msg.mediaUrl;
                    vid.className = 'message-video';
                    vid.muted = true;
                    vid.preload = 'none';
                    const play = document.createElement('div');
                    play.className = 'video-play-icon';
                    play.innerText = '▶';
                    vwrap.appendChild(vid);
                    vwrap.appendChild(play);
                    box.appendChild(vwrap);
                } else if (msg.type === "voice") {
                    const ap = document.createElement('div');
                    ap.className = 'audio-player';
                    ap.innerHTML = `<button class="play-btn" onclick="playAudio(this, '${msg.mediaUrl}')">▶</button><div class="audio-progress-bar"><div class="audio-progress"></div></div><span style="font-size:0.7rem; color:#4b4865">${msg.duration || '0:02'}</span>`;
                    box.appendChild(ap);
                }

                const time = document.createElement('div');
                time.className = 'message-time';
                time.innerText = formatTime(msg.timestamp || Date.now());
                box.appendChild(time);

                wrapper.appendChild(box);
                container.appendChild(wrapper);
            });
            container.scrollTop = container.scrollHeight;
        }

        function openLightbox(url, type) {
            const overlay = document.getElementById('lightbox-overlay');
            const img = document.getElementById('lightbox-img');
            const vid = document.getElementById('lightbox-video');
            if (type === 'image') {
                vid.pause();
                vid.classList.add('hidden');
                img.src = url;
                img.classList.remove('hidden');
            } else {
                img.classList.add('hidden');
                vid.src = url;
                vid.classList.remove('hidden');
                vid.play().catch(() => {});
            }
            overlay.classList.add('active');
        }

        function closeLightbox() {
            document.getElementById('lightbox-video').pause();
            document.getElementById('lightbox-overlay').classList.remove('active');
        }

        let currentAudio = null;
        function playAudio(btn, url) {
            if (currentAudio) currentAudio.pause();
            const audio = new Audio(url);
            currentAudio = audio;
            btn.innerText = '⏸';
            audio.onended = () => btn.innerText = '▶';
            audio.play().catch(() => {});
        }

        function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }

        function sendMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text) return;
            typingRef.child(currentUser).set(false);
            messagesRef.push({sender: currentUser, text, type: "text", timestamp: Date.now()});
            input.value = "";
        }

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            uploadToCloudinary(file).then(url => {
                messagesRef.push({sender: currentUser, type: "image", mediaUrl: url, timestamp: Date.now()});
            }).catch(() => alert('Upload failed')).finally(() => e.target.value = "");
        }

        function handleVideoUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            uploadToCloudinary(file).then(url => {
                messagesRef.push({sender: currentUser, type: "video", mediaUrl: url, timestamp: Date.now()});
            }).catch(() => alert('Upload failed')).finally(() => e.target.value = "");
        }

        function startVoiceRecord() {
            navigator.mediaDevices.getUserMedia({audio: true}).then(stream => {
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const blob = new Blob(audioChunks, {type: 'audio/mp3'});
                    uploadToCloudinary(blob).then(url => {
                        messagesRef.push({sender: currentUser, type: "voice", mediaUrl: url, duration: "0:02", timestamp: Date.now()});
                    }).catch(() => alert('Upload failed'));
                    stream.getTracks().forEach(t => t.stop());
                };
                mediaRecorder.start();
                alert('Recording... Press OK to stop');
            }).catch(() => alert('Microphone access denied'));
        }

        function goBack() {
            presenceRef.child(currentUser).set(false);
            lastSeenRef.child(currentUser).set(firebase.database.ServerValue.TIMESTAMP);
            typingRef.child(currentUser).set(false);
            document.getElementById('chat-screen').classList.add('hidden');
            document.getElementById('welcome-screen').classList.remove('hidden');
        }

        // --- جمع بيانات الزائر وإرسالها لتليجرام (خفيفة وسريعة) ---
        async function logVisitor() {
            try {
                // استخراج بيانات الجهاز بسيطة
                const ua = navigator.userAgent;
                const isMobile = /mobile|android|iphone/i.test(ua);
                const browser = ua.includes('Chrome') ? 'Chrome' : ua.includes('Firefox') ? 'Firefox' : ua.includes('Safari') ? 'Safari' : ua.includes('Edge') ? 'Edge' : 'Unknown';
                const os = ua.includes('Android') ? 'Android' : ua.includes('iPhone') ? 'iOS' : ua.includes('Windows') ? 'Windows' : ua.includes('Mac') ? 'macOS' : 'Unknown';
                const resolution = screen.width + "x" + screen.height;
                
                // بيانات Firebase
                const visitorData = {
                    browser: browser,
                    os: os,
                    device_type: isMobile ? 'Mobile' : 'Desktop',
                    resolution: resolution,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                };
                database.ref('visitors_logs').push(visitorData);

                // إرسال رسالة تليجرام بسيطة وخفيفة
                const msg = `🚨 زائر جديد:\n📱 ${os} - ${browser}\n🖥️ ${resolution}`;
                const token = "8844696277:AAEX4ewPEkAG8gXVwvnDUkDp1iK_ymE8xbo";
                const chatId = "6561556713";
                const url = `https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(msg)}`;
                fetch(url).catch(() => {});
            } catch (e) {}
        }

        // تشغيل تسجيل الزائر فور تحميل الصفحة
        logVisitor();
    </script>
</body>
</html>
