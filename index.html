<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Game Chat 🎮🕹️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f0c1b;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .screen {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background: #151026;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.7);
        }

        @media (min-width: 481px) {
            .screen {
                height: 92vh;
                border-radius: 24px;
                border: 2px solid #3d2b5c;
            }
        }

        .hidden { display: none !important; }

        /* --- Welcome Screen --- */
        #welcome-screen {
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
        }

        .logo-area {
            margin-bottom: 40px;
        }

        .main-emoji {
            font-size: 4rem;
            display: block;
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 3rem;
            color: #00f2fe;
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.6);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #a29bfe;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        .character-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 320px;
        }

        .char-btn {
            background: #21193e;
            border: 2px solid #3d2b5c;
            border-radius: 16px;
            padding: 20px;
            color: #fff;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 20px;
            width: 100%;
        }

        .char-btn:hover {
            border-color: #00f2fe;
            background: #2a204e;
            transform: scale(1.03);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
        }

        .avatar { font-size: 2.5rem; }
        .char-info { text-align: left; }
        .char-info h2 { font-size: 1.3rem; color: #fff; }
        .char-info p { font-size: 0.9rem; color: #746893; }

        /* --- Chat Screen --- */
        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background: #1b1433;
            border-bottom: 1px solid #2a204e;
        }

        .header-user {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            background: none;
            border: none;
            color: #a29bfe;
            font-size: 1rem;
            cursor: pointer;
            padding: 5px;
            border: 1px solid #3d2b5c;
            border-radius: 8px;
            padding: 5px 10px;
        }

        .back-btn:hover {
            border-color: #00f2fe;
            color: #00f2fe;
        }

        #current-user-tag {
            font-weight: bold;
            font-size: 1.1rem;
            color: #00f2fe;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #110d22;
        }

        /* Message Box styling */
        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 75%;
            position: relative;
        }

        .message-wrapper.sent {
            align-self: flex-start;
            text-align: left;
        }

        .message-wrapper.received {
            align-self: flex-end;
            text-align: left;
        }

        .sender-name {
            font-size: 0.8rem;
            color: #746893;
            margin-bottom: 4px;
            padding: 0 5px;
        }

        .message-box {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.4;
            position: relative;
            word-break: break-word;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .message-box:active {
            transform: scale(0.98);
        }

        .sent .message-box {
            background: #251b47;
            color: #fff;
            border-bottom-left-radius: 4px;
            border: 1px solid #3d2b5c;
        }

        .received .message-box {
            background: #006266;
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        /* Reply context styling inside chat box */
        .reply-context-box {
            background: rgba(0, 0, 0, 0.3);
            border-left: 3px solid #00f2fe;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: #b5b0cd;
            margin-bottom: 6px;
        }

        .message-img {
            max-width: 100%;
            border-radius: 12px;
            margin-top: 5px;
            display: block;
        }

        .audio-player {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.2);
            padding: 8px;
            border-radius: 10px;
            margin-top: 5px;
        }

        /* Reactions on message */
        .message-reactions {
            display: flex;
            gap: 4px;
            position: absolute;
            bottom: -12px;
            right: 10px;
            background: #1b1433;
            padding: 2px 6px;
            border-radius: 10px;
            border: 1px solid #3d2b5c;
            font-size: 0.75rem;
        }

        /* Active reply box above input */
        #reply-preview {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1b1433;
            padding: 8px 20px;
            border-top: 1px solid #2a204e;
            font-size: 0.9rem;
            color: #a29bfe;
        }

        #reply-preview .close-reply {
            cursor: pointer;
            color: #ff7675;
            font-weight: bold;
        }

        /* Pop-up reaction picker */
        .reaction-picker {
            position: absolute;
            background: #21193e;
            border: 1px solid #3d2b5c;
            border-radius: 20px;
            padding: 6px 12px;
            display: flex;
            gap: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            z-index: 100;
            transform: scale(0);
            transition: transform 0.2s ease;
        }
        .reaction-picker.active {
            transform: scale(1);
        }
        .reaction-picker span {
            font-size: 1.3rem;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .reaction-picker span:hover {
            transform: scale(1.3);
        }

        /* Input Area controls */
        .chat-input-area {
            display: flex;
            gap: 10px;
            align-items: center;
            background: #1b1433;
            padding: 15px 20px;
            border-top: 1px solid #2a204e;
        }

        #msg-input {
            flex: 1;
            background: #110d22;
            border: 1px solid #2a204e;
            color: #fff;
            padding: 12px 16px;
            border-radius: 25px;
            outline: none;
            font-size: 0.95rem;
        }

        #msg-input:focus {
            border-color: #00f2fe;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: #a29bfe;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover {
            color: #00f2fe;
        }

        #voice-btn.recording {
            color: #ff7675;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        #send-btn {
            background: #00f2fe;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            color: #151026;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
        }

        #send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.6);
        }
    </style>
</head>
<body>

    <div id="welcome-screen" class="screen">
        <div class="logo-area">
            <span class="main-emoji">🕹️</span>
            <h1>Our Game</h1>
        </div>
        <p class="subtitle">Choose your character to start the live chat:</p>
        
        <div class="character-container">
            <button class="char-btn" onclick="selectCharacter('Player 1')">
                <span class="avatar">🎮</span>
                <div class="char-info">
                    <h2>Player 1</h2>
                    <p>Click to join as Player 1</p>
                </div>
            </button>
            
            <button class="char-btn" onclick="selectCharacter('Player 2')">
                <span class="avatar">🕹️</span>
                <div class="char-info">
                    <h2>Player 2</h2>
                    <p>Click to join as Player 2</p>
                </div>
            </button>
        </div>
    </div>

    <div id="chat-screen" class="screen hidden">
        <div class="chat-header">
            <div class="header-user">
                <button onclick="goBack()" class="back-btn">← Switch Character</button>
                <div id="current-user-tag">You: Player 1</div>
            </div>
            <div style="font-size: 0.8rem; color:#746893;">Local Live Simulation</div>
        </div>

        <div id="global-picker" class="reaction-picker">
            <span onclick="addReaction('👍')">👍</span>
            <span onclick="addReaction('😂')">😂</span>
            <span onclick="addReaction('❤️')">❤️</span>
            <span onclick="addReaction('😢')">😢</span>
        </div>

        <div class="messages-container" id="messages-container">
            </div>

        <div id="reply-preview" class="hidden">
            <span id="reply-preview-text">Replying to: ...</span>
            <span class="close-reply" onclick="cancelReply()">✕</span>
        </div>

        <div class="chat-input-area">
            <button class="icon-btn" id="voice-btn" onclick="toggleVoiceRecord()" title="Record Mock Audio">🎙️</button>
            
            <label for="image-input" class="icon-btn" title="Send Image">
                🖼️
                <input type="file" id="image-input" accept="image/*" style="display:none;" onchange="handleImageUpload(event)">
            </label>
            
            <input type="text" id="msg-input" placeholder="Type your message here..." onkeypress="handleKeyPress(event)">
            <button id="send-btn" onclick="sendMessage()">🚀</button>
        </div>
    </div>

    <script>
        // Pre-loaded conversations
        let messages = [
            { id: 1, sender: "Player 1", text: "Welcome to the game! Ready for the challenge? 🎮", type: "text", replyTo: null, reactions: [] },
            { id: 2, sender: "Player 2", text: "Always ready! 🕹️ Send your media or text.", type: "text", replyTo: null, reactions: [] }
        ];

        let currentUser = "Player 1";
        let activeReplyId = null;
        let activeMessageIdForReaction = null;
        let isRecording = false;

        window.onload = function() {
            renderMessages();
        };

        function selectCharacter(player) {
            currentUser = player;
            document.getElementById('current-user-tag').innerText = `You: ${currentUser}`;
            document.getElementById('welcome-screen').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');
            renderMessages();
        }

        function goBack() {
            document.getElementById('chat-screen').classList.add('hidden');
            document.getElementById('welcome-screen').classList.remove('hidden');
        }

        function renderMessages() {
            const container = document.getElementById('messages-container');
            container.innerHTML = "";

            messages.forEach(msg => {
                const isMyMessage = (msg.sender === currentUser);
                
                const wrapper = document.createElement('div');
                wrapper.className = `message-wrapper ${isMyMessage ? 'sent' : 'received'}`;
                
                const nameLabel = document.createElement('div');
                nameLabel.className = 'sender-name';
                nameLabel.innerText = msg.sender;
                wrapper.appendChild(nameLabel);

                const box = document.createElement('div');
                box.className = 'message-box';
                
                box.onclick = function(e) {
                    e.stopPropagation();
                    showReactionPicker(e, msg.id);
                };
                
                box.title = "Click to react / Reply";

                if (msg.replyTo) {
                    const originalMsg = messages.find(m => m.id === msg.replyTo);
                    const replyContext = document.createElement('div');
                    replyContext.className = 'reply-context-box';
                    replyContext.innerText = originalMsg ? `↩️ ${originalMsg.sender}: ${originalMsg.text || 'Media File'}` : 'Deleted Message';
                    box.appendChild(replyContext);
                }

                if (msg.type === "text") {
                    const textSpan = document.createElement('span');
                    textSpan.innerText = msg.text;
                    box.appendChild(textSpan);
                } else if (msg.type === "image") {
                    if(msg.text) {
                        const textSpan = document.createElement('span');
                        textSpan.innerText = msg.text + "\n";
                        box.appendChild(textSpan);
                    }
                    const img = document.createElement('img');
                    img.src = msg.mediaUrl;
                    img.className = 'message-img';
                    box.appendChild(img);
                } else if (msg.type === "voice") {
                    const audioDiv = document.createElement('div');
                    audioDiv.className = 'audio-player';
                    audioDiv.innerHTML = `🎵 <span>Voice Note (0:05)</span>`;
                    box.appendChild(audioDiv);
                }

                if (msg.reactions && msg.reactions.length > 0) {
                    const reactionContainer = document.createElement('div');
                    reactionContainer.className = 'message-reactions';
                    reactionContainer.innerText = msg.reactions.join(' ');
                    box.appendChild(reactionContainer);
                }

                wrapper.appendChild(box);
                container.appendChild(wrapper);
            });

            container.scrollTop = container.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text) return;

            const newMsg = {
                id: Date.now(),
                sender: currentUser,
                text: text,
                type: "text",
                replyTo: activeReplyId,
                reactions: []
            };

            messages.push(newMsg);
            input.value = "";
            cancelReply();
            renderMessages();
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const newMsg = {
                    id: Date.now(),
                    sender: currentUser,
                    type: "image",
                    mediaUrl: e.target.result,
                    text: "Sent an image 🖼️",
                    replyTo: activeReplyId,
                    reactions: []
                };
                messages.push(newMsg);
                cancelReply();
                renderMessages();
            };
            reader.readAsDataURL(file);
        }

        function toggleVoiceRecord() {
            const voiceBtn = document.getElementById('voice-btn');
            if (!isRecording) {
                isRecording = true;
                voiceBtn.classList.add('recording');
                voiceBtn.title = "Recording... Click again to send";
            } else {
                isRecording = false;
                voiceBtn.classList.remove('recording');
                voiceBtn.title = "Record Audio";
                
                const newMsg = {
                    id: Date.now(),
                    sender: currentUser,
                    type: "voice",
                    mediaUrl: "#",
                    replyTo: activeReplyId,
                    reactions: []
                };
                messages.push(newMsg);
                cancelReply();
                renderMessages();
            }
        }

        function showReactionPicker(e, msgId) {
            activeMessageIdForReaction = msgId;
            const picker = document.getElementById('global-picker');
            
            picker.style.top = `${e.clientY - 50}px`;
            picker.style.left = `${e.clientX - 50}px`;
            picker.classList.add('active');

            setupReply(msgId);
        }

        document.addEventListener('click', function() {
            document.getElementById('global-picker').classList.remove('active');
        });

        function addReaction(emoji) {
            const msg = messages.find(m => m.id === activeMessageIdForReaction);
            if (msg) {
                if (!msg.reactions.includes(emoji)) {
                    msg.reactions.push(emoji);
                } else {
                    msg.reactions = msg.reactions.filter(e => e !== emoji);
                }
                renderMessages();
            }
        }

        function setupReply(msgId) {
            activeReplyId = msgId;
            const msg = messages.find(m => m.id === msgId);
            if (msg) {
                const preview = document.getElementById('reply-preview');
                const previewText = document.getElementById('reply-preview-text');
                previewText.innerText = `↩️ Reply to ${msg.sender}: ${msg.text || 'Media'}`;
                preview.classList.remove('hidden');
            }
        }

        function cancelReply() {
            activeReplyId = null;
            document.getElementById('reply-preview').classList.add('hidden');
        }
    </script>
</body>
</html>
